name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/utslovakia_test
  PAYLOAD_SECRET: ci-test-secret
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: utslovakia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:int

      # Schema push is disabled (src/payload.config.ts), so the empty CI database is
      # created from the migrations — this also proves they apply cleanly from scratch.
      - name: Apply migrations
        run: pnpm migrate

      - name: Build
        run: pnpm build

      # Playwright e2e is intentionally not run here — it boots a full `pnpm dev`
      # server and is heavier/flakier in CI. Run `pnpm test:e2e` locally (against a
      # database from .env.test.local) before merging changes that touch behavior.
